short_bio: >-
  <p>
    I am a research engineer and technical advisor working on avionics architectures,
    model-based systems engineering, integrated modular avionics, and deterministic
    communication systems for safety-critical aerospace applications.
  </p>

  <p>
    My work focuses on modular avionics platforms, TSN/SDN-based networking,
    model-based configuration processes, certification aspects of distributed systems,
    and the integration of engineering workflows across heterogeneous environments.
  </p>

  <p>
    I am currently working at the
    <a href="https://www.dlr.de/ft/" target="_blank">DLR Institute of Flight Systems</a>
    in Braunschweig, Germany.
  </p>

